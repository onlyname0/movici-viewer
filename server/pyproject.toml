[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]

[tool.poetry]
name = "movici-viewer"
version = "1.0.1"
description = "Movici Viewer"
authors = ["Pelle Koster <pelle.koster@nginfra.nl>"]
include = ["movici_viewer/ui/**/*"]

[tool.poetry.scripts]
movici-viewer = "movici_viewer.main:main"

[tool.poetry.dependencies]
click = "^8.1.3"
fastapi = "^0.98.0"
movici-simulation-core = {version = "2.10.4", extras = ["models"]}
numba = "0.57.1"
orjson = "^3.9.1"
pydantic = "^1.10.9"
python = "^3.8"
uvicorn = {extras = ["standard"], version = "^0.22.0"}

pytest = {version = "^6.2.5", optional = true}
httpx = {version = "^0.24.1", optional = true}

[tool.poetry.extras]
dev = ["httpx", "pytest", "ruff"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
    "B024", # abstract base class without abstract methods
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
